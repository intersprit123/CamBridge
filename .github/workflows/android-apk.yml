name: Android APK preview

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - name: Generate Android wrapper project
        run: |
          rm -f android/README.md
          rmdir android 2>/dev/null || true
          npx cap add android
          npx cap sync android
          node scripts/patch-android-preview.mjs
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-Generated-Android-Project
          path: android/
          if-no-files-found: error
