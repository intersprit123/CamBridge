name: Windows installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Prepare desktop app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/app | Out-Null
          Copy-Item -Path dist/* -Destination desktop/app -Recurse -Force
      - run: npm --prefix desktop install
      - run: npm --prefix desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-Windows-Installers
          path: |
            desktop/release/*.exe
            desktop/release/*.msi
          if-no-files-found: error
