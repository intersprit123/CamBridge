name: CamBridge Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check Android project files
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "::warning::Gradle wrapper is missing; Android APK build skipped."
          fi
